function nav(){return `<nav class="nav" aria-label="画面切替"><button data-action="home" class="${page==='home'?'active':''}">🏠 ホーム</button><button data-action="setup" class="${page==='setup'?'active':''}">📚 問題演習</button><button data-action="analysis" class="${page==='analysis'?'active':''}">📊 分析</button><button data-action="account" class="${page==='account'?'active':''}">👤 設定</button><button data-action="review" class="${page==='review'?'active':''}">💪 復習</button></nav>`;}
function getSet(){return SETS.find(s=>s.id===chosenSet)||SETS[0];}
function studyStats(){let c=data.study.filter(x=>x.ok).length;return{count:data.study.length,correct:c,rate:pct(c,data.study.length)};}
function localDay(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function allQuestions(){return SETS.flatMap(s=>s.questions);}
function historyFor(id){return data.attempts.filter(a=>a.id===id).sort((a,b)=>a.at-b.at);}
function mastery(id){const h=historyFor(id);if(!h.length)return{type:'gray',label:'⚪ 未回答',streak:0};let wrong=0,hadWrong=false,days=new Set(),mastered=false;for(const a of h){if(!a.ok){wrong++;hadWrong=true;days.clear();mastered=false;}else{wrong=0;if(hadWrong){days.add(localDay(a.at));if(days.size>=2)mastered=true;}}}if(mastered)return{type:'green',label:'🟢 克服済み',streak:0};if(wrong>=2)return{type:'red',label:'🔴 連続不正解',streak:wrong};if(hadWrong&&days.size===1)return{type:'blue',label:'🔵 克服確認中',streak:0};if(hadWrong)return{type:'yellow',label:'🟡 復習対象',streak:wrong};return{type:'green',label:'🟢 正解のみ',streak:0};}
function recordAttempt(q,ok,source,at){data.attempts.push({id:q.id,ok,source,at});}
function toggleFavorite(id){const i=data.favorites.indexOf(id);if(i<0)data.favorites.push(id);else data.favorites.splice(i,1);save();}
function reviewCounts(){const result={red:0,yellow:0,blue:0,green:0,favorites:data.favorites.length};for(const q of allQuestions()){const m=mastery(q.id);if(m.type==='green'&&m.label==='🟢 正解のみ')continue;if(result[m.type]!==undefined)result[m.type]++;}return result;}
function review(){page='review';let c=reviewCounts();const opts=[['all','すべて'],['red','🔴 連続不正解'],['yellow','🟡 復習対象'],['blue','🔵 確認中'],['green','🟢 克服済み'],['favorites','⭐ お気に入り']];let qs=allQuestions().filter(q=>{const m=mastery(q.id);if(reviewFilter==='favorites')return data.favorites.includes(q.id);if(reviewFilter==='all')return m.type!=='gray'&&m.label!=='🟢 正解のみ';return m.type===reviewFilter&&(reviewFilter!=='green'||m.label==='🟢 克服済み');});qs.sort((a,b)=>{const ma=mastery(a.id),mb=mastery(b.id);const rank=m=>m.type==='red'?0:m.type==='yellow'?1:m.type==='blue'?2:3;const pa=a.domain===0?-1:0,pb=b.domain===0?-1:0;return pa-pb||rank(ma)-rank(mb)||mb.streak-ma.streak;});el(header('💪 苦手克服','学習と模試の両方の解答履歴で判定。別の日に2回正解で克服！')+nav()+`<section class="card"><div class="grid"><div class="stat"><small>🔴 連続不正解</small><b>${c.red}</b></div><div class="stat"><small>🟡 復習対象</small><b>${c.yellow}</b></div><div class="stat"><small>🔵 克服確認中</small><b>${c.blue}</b></div><div class="stat"><small>🟢 克服済み</small><b>${c.green}</b></div></div><p class="muted">⭐ お気に入り ${c.favorites}問。過去のver.0.3の模試は問題別解答履歴がないため、今回以降の模試から苦手判定に反映されるよ。</p></section><section class="card"><h2>📋 復習リスト</h2><div class="filterrow">${opts.map(([v,t])=>`<button type="button" class="smallbtn ${reviewFilter===v?'current':''}" data-filter="${v}">${t}</button>`).join('')}</div><label class="field" for="reviewSet">問題集</label><select id="reviewSet"><option value="all">すべての問題集</option>${SETS.map(x=>`<option value="${x.id}" ${reviewTarget===x.id?'selected':''}>${escape(x.name)}</option>`).join('')}</select><div id="reviewList">${reviewListHTML(qs)}</div>${qs.length?button('💪 表示条件の問題をまとめて復習','startReview'):''}</section>`);}
function reviewListHTML(qs){if(reviewTarget&&reviewTarget!=='all')qs=qs.filter(q=>String(q.set).replace(/^([12])$/,'s$1')===reviewTarget);if(!qs.length)return '<p class="muted">この条件の問題はまだないよ。学習や模試を解いてみよう！</p>';return qs.map(q=>{const m=mastery(q.id),fav=data.favorites.includes(q.id);return `<div class="reviewitem ${m.type}"><div class="row" style="justify-content:space-between"><strong>${String(q.set).replace(/^s/,'')==='1'?'第1回':'第2回'} · 問${q.n}</strong><span class="pill ${m.type==='red'?'bad':''}">${m.label}</span></div><p class="muted">${escape(DOMAINS[q.domain].name)}${q.domain===0&&m.type!=='green'?' · 🚨 足切り対策':''}${m.streak>=2?' · '+m.streak+'回連続不正解':''}</p><p>${escape(q.text)}</p><div class="row"><button type="button" class="smallbtn" data-action="openSingleReview" data-question-id="${q.id}">この問題を解く</button><button type="button" class="smallbtn" data-fav="${q.id}">${fav?'★ 登録済み':'☆ お気に入り'}</button></div></div>`;}).join('');}
function startReview(){const qs=allQuestions().filter(q=>{const m=mastery(q.id);return reviewFilter==='favorites'?data.favorites.includes(q.id):reviewFilter==='all'?(m.type!=='gray'&&m.label!=='🟢 正解のみ'):m.type===reviewFilter;}).filter(q=>!reviewTarget||reviewTarget==='all'||String(q.set).replace(/^([12])$/,'s$1')===reviewTarget);if(!qs.length){alert('復習する問題がまだないよ！');return;}qs.sort((a,b)=>(a.domain===0?-1:0)-(b.domain===0?-1:0));mode='review';active=qs;idx=0;selected=[];graded=false;renderQuiz();}
function home(){page='home';let s=studyStats(),m=data.mocks,last=m[m.length-1],avg=m.length?pct(m.reduce((a,x)=>a+x.correct,0),m.length*70):0,best=m.length?Math.max(...m.map(x=>x.correct)):0;
el(header('資格対策を、もっと楽しく！', (profile.nickname?'おかえり、'+escape(profile.nickname)+'！ ':'')+'学習と模擬試験を別々に記録。得意・苦手も見つけよう！')+nav()+`<div class="section-eyebrow">今日のクエスト</div><div class="quick-grid"><button class="quick-tile" data-action="setup"><span class="tile-icon">▤</span><b>学習モード</b><small>分野ごとに学ぼう</small></button><button class="quick-tile" data-action="setup"><span class="tile-icon">♧</span><b>模擬試験</b><small>本番形式に挑戦</small></button><button class="quick-tile" data-action="review"><span class="tile-icon">◇</span><b>苦手克服</b><small>弱点を集中復習</small></button><button class="quick-tile" data-action="review"><span class="tile-icon">☆</span><b>お気に入り</b><small>覚えておきたい問題</small></button></div><section class="card"><h2>学習モードの成績</h2><div class="grid"><div class="stat"><small>解答回数</small><b>${s.count}回</b></div><div class="stat"><small>累計正答率</small><b>${s.rate}%</b></div><div class="stat"><small>正解回数</small><b>${s.correct}回</b></div><div class="stat"><small>初回正答率</small><b>${firstStats().rate}%</b></div></div></section><section class="card"><h2>🏆 模擬試験の成績</h2><div class="grid"><div class="stat"><small>受験回数</small><b>${m.length}回</b></div><div class="stat"><small>平均正答率</small><b>${avg}%</b></div><div class="stat"><small>最高得点</small><b>${best}/70</b></div><div class="stat"><small>直近の得点</small><b>${last?last.correct+'/70':'未受験'}</b></div></div>${last?`<p class="muted">直近：${escape(last.setName)}／${last.examType==='new'?'新規':'更新'}／${last.passed?'合格':'不合格'}</p>`:''}</section><section class="card"><h2>🚀 今日の学習</h2>${button('📚 問題集・分野を選んで学習','setup')}${button('📊 得意・苦手を分析','analysis','secondary')}${button('💪 苦手克服・お気に入り','review','secondary')}</section><div class="notice">🔐 これは架空の問題で動作確認する試作版。問題集は各70問×2セット。実際の社内問題は収録していないよ。</div>`);}
function firstStats(){let seen=new Set(),n=0,c=0;data.study.forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);n++;if(x.ok)c++;}});return{n,c,rate:pct(c,n)};}
function setup(){page='setup';el(header('問題演習','問題集・分野・受験区分を選ぼう')+nav()+`<section class="card"><h2>📚 問題集を選択</h2><label class="field" for="set">問題集</label><select id="set">${SETS.map(s=>`<option value="${s.id}" ${s.id===chosenSet?'selected':''}>${escape(s.name)}（70問）</option>`).join('')}</select><p class="muted">全セット共通：コンプライアンス5問、自社サービス40問、自社受付業務6問、他社知識・比較10問、業界関連商品・サービス4問、CS5問。</p><label class="field" for="domain">学習する分野</label><select id="domain"><option value="all">全分野（70問）</option>${DOMAINS.map((d,i)=>`<option value="${i}" ${chosenDomain===String(i)?'selected':''}>${escape(d.name)}（${d.count}問）</option>`).join('')}</select>${button('📖 学習モードを始める','startStudy')}${button('🚨 コンプライアンス5問特訓','startCompliance','secondary')}</section><section class="card"><h2>🏆 模擬試験（70問）</h2><p class="muted">分野指定とは別に、選んだ問題集の全70問を出題。最後にまとめて採点するよ。</p><label class="field" for="examType">受験区分</label><select id="examType"><option value="new" ${examType==='new'?'selected':''}>新規認定（総合70%以上）</option><option value="renew" ${examType==='renew'?'selected':''}>更新認定（総合65%以上）</option></select><div class="notice">合格には総合基準に加え、コンプライアンス5問中4問以上の正解が必要だよ。</div>${button('🏁 70問の模擬試験を始める','startMock')}</section>`);}
function start(which){const set=getSet();mode=which;active=(which==='mock'?set.questions:set.questions.filter(q=>chosenDomain==='all'||q.domain===Number(chosenDomain))).slice();idx=0;selected=[];graded=false;lastResult=null;page='quiz';renderQuiz();}
function startCompliance(){chosenDomain='0';start('study');}
function renderQuiz(){error.textContent='';let q=active[idx];if(!q){finish();return;}page='quiz';let selectedText=selected;let done=mode!=='mock'&&graded;let pctProgress=pct(idx,active.length);el(`<section class="top"><span class="pill">${mode==='mock'?'🏆 模擬試験':mode==='review'?'💪 復習':'📖 学習モード'}</span><button type="button" class="smallbtn" data-action="exit">終了して戻る</button></section><section class="card"><div class="row" style="justify-content:space-between"><b>${idx+1} / ${active.length} 問</b><span class="pill">${escape(DOMAINS[q.domain].name)}</span></div><div class="bar"><div style="width:${pctProgress}%"></div></div><p class="muted">${escape((SETS.find(x=>x.id===String(q.set).replace(/^([12])$/,'s$1'))||{name:'サンプル問題集'}).name)} · ${q.type==='multi'?'複数選択（すべて選ぶ）':q.type==='tf'?'○×問題':'単一選択'}</p><div class="row" style="justify-content:flex-end"><button type="button" class="smallbtn star" data-fav="${q.id}">${data.favorites.includes(q.id)?'★ お気に入り登録済み':'☆ お気に入り'}</button></div><div class="question">${escape(q.text)}</div><div class="choices" role="group" aria-label="選択肢">${q.options.map((o,j)=>`<button type="button" class="choice ${selectedText.includes(j)?'selected':''} ${done&&q.correct.includes(j)?'correct':''} ${done&&selectedText.includes(j)&&!q.correct.includes(j)?'wrong':''}" data-choice="${j}" ${done?'disabled':''}><span>${q.type==='multi'?(selectedText.includes(j)?'☑':'☐'):LETTERS[j]}</span><span>${escape(o)}</span></button>`).join('')}</div>${done?`<div class="feedback" role="status"><strong>${isCorrect(q,selected)?'🎉 正解！':'💡 不正解'}</strong><br>正解：${q.correct.map(j=>escape(q.options[j])).join('、')}<br><span class="muted">${escape(q.explain)}</span></div>`:''}<div class="row">${mode!=='mock'?(done?button(idx===active.length-1?'学習結果を見る':'次の問題へ →','next'):button('解答する','grade')):button(idx===active.length-1?'模擬試験を採点する':'次の問題へ →','next')}</div>${mode==='mock'?'<p class="muted">模擬試験は途中で正解を表示しないよ。未選択でも次に進めるよ。</p>':''}</section>`);}
function isCorrect(q,ans){return q.correct.length===ans.length&&q.correct.every(v=>ans.includes(v));}
function grade(){if(!selected.length){alert('選択肢を選んでね！');return;}let q=active[idx],ok=isCorrect(q,selected),at=Date.now();data.study.push({id:q.id,set:q.set,domain:q.domain,ok,at});recordAttempt(q,ok,mode,at);save();graded=true;renderQuiz();}
let mockAnswers=[];
function next(){if(mode!=='mock'&&!graded)return;if(mode==='mock')mockAnswers[idx]=selected.slice();idx++;selected=[];graded=false;if(idx>=active.length)finish();else renderQuiz();}
function finish(){if(mode==='mock'){let total=0,byDomain=DOMAINS.map(()=>({correct:0,total:0}));active.forEach((q,i)=>{let ok=isCorrect(q,mockAnswers[i]||[]);byDomain[q.domain].total++;if(ok){total++;byDomain[q.domain].correct++;}recordAttempt(q,ok,'mock',Date.now()+i);});let compliance=byDomain[0].correct;let newPass=total>=49&&compliance>=4,renewPass=total>=46&&compliance>=4;lastResult={id:Date.now(),setName:getSet().name,setId:chosenSet,examType,correct:total,compliance,byDomain,newPass,renewPass,passed:examType==='new'?newPass:renewPass,at:Date.now()};data.mocks.push(lastResult);save();mockAnswers=[];showResult();}else if(mode==='review'){review();}else{page='home';home();}}
function showResult(){page='result';let r=lastResult;if(!r){home();return;}let compOK=r.compliance>=4;let cutoff=r.examType==='new'?49:46;let pass=r.passed;el(header(pass?'🎉 合格！':'📚 もう一歩！',`${escape(r.setName)} ／ ${r.examType==='new'?'新規認定':'更新認定'}の判定`)+`<section class="card"><div class="summary">${r.correct} / 70 <small style="font-size:18px">(${pct(r.correct,70)}%)</small></div><div class="grid"><div class="stat"><small>総合基準</small><b>${r.correct>=cutoff?'✅ 達成':'❌ 未達'}</b><small>${cutoff}問以上必要</small></div><div class="stat"><small>コンプライアンス</small><b>${compOK?'✅ 達成':'❌ 未達'}</b><small>${r.compliance}/5問（4問以上必要）</small></div></div><div class="divider"></div><h3>新規・更新の両方の判定</h3><p><span class="pill ${r.newPass?'ok':'bad'}">新規：${r.newPass?'合格':'不合格'}</span> <span class="pill ${r.renewPass?'ok':'bad'}">更新：${r.renewPass?'合格':'不合格'}</span></p><p class="muted">${!compOK?'コンプライアンスの基準未達があるため、総合点にかかわらず不合格になるよ。':r.correct<49?'新規認定まであと'+(49-r.correct)+'問。':'総合点とコンプライアンスの両基準をクリア！'}</p></section><section class="card"><h2>📊 分野別結果</h2>${r.byDomain.map((v,i)=>domainRow(DOMAINS[i].name,v.correct,v.total,null)).join('')}</section>${button('📊 分野別の累計分析を見る','analysis','secondary')}${button('💪 間違えた問題を復習','review','secondary')}${button('🏠 ホームへ','home')}`);}
function domainRow(name,c,n,action){let rate=pct(c,n);return `<div class="domain"><div class="row"><b>${escape(name)}</b><span class="pill ${n&&rate<80?'warn':'ok'}">${c}/${n}問 · ${rate}%</span></div><div class="bar"><div style="width:${rate}%"></div></div>${action?`<button type="button" class="smallbtn" data-domain="${action}">この分野を学習</button>`:''}</div>`;}
function analysis(){page='analysis';let s=studyStats(),fs=firstStats(),m=data.mocks,last=m[m.length-1];let seen=new Set(),ds=DOMAINS.map(()=>({firstN:0,firstC:0,allN:0,allC:0}));data.study.forEach(x=>{let v=ds[x.domain];if(!v)return;v.allN++;if(x.ok)v.allC++;if(!seen.has(x.id)){seen.add(x.id);v.firstN++;if(x.ok)v.firstC++;}});let priorities=ds.map((v,i)=>({i,n:v.firstN,rate:pct(v.firstC,v.firstN),lost:DOMAINS[i].count*(1-pct(v.firstC,v.firstN)/100)})).filter(v=>v.n>0).sort((a,b)=>a.i===0&&a.rate<80?-1:b.i===0&&b.rate<80?1:b.lost-a.lost);let suggestion=priorities.length?DOMAINS[priorities[0].i].name:'まだ学習履歴がないよ';el(header('📊 成績分析','学習・模試・分野別を分けてチェック！')+nav()+`<section class="card"><h2>📖 学習モード</h2><div class="grid"><div class="stat"><small>累計解答回数</small><b>${s.count}</b></div><div class="stat"><small>累計正答率</small><b>${s.rate}%</b></div><div class="stat"><small>初回解答問題数</small><b>${fs.n}</b></div><div class="stat"><small>初回正答率</small><b>${fs.rate}%</b></div></div><p class="muted">初回正答率＝同じ問題を初めて解いた時の結果。累計正答率＝解き直しを含む全解答の結果。</p></section><section class="card"><h2>🏆 模擬試験</h2><div class="grid"><div class="stat"><small>受験回数</small><b>${m.length}</b></div><div class="stat"><small>平均正答率</small><b>${m.length?pct(m.reduce((a,x)=>a+x.correct,0),70*m.length):0}%</b></div></div>${last?`<p class="muted">直近：${last.correct}/70問 · コンプライアンス ${last.compliance}/5問</p>`:'<p class="muted">模試の履歴はまだないよ。</p>'}</section><section class="card"><h2>🧠 分野別・初回正答率</h2><p class="muted">問題集をまたいで集計。未学習の分野は判定しないよ。</p>${ds.map((v,i)=>`<div class="domain"><div class="row"><b>${escape(DOMAINS[i].name)}</b><span class="pill ${v.firstN===0?'':i===0&&pct(v.firstC,v.firstN)<80?'bad':pct(v.firstC,v.firstN)>=80?'ok':'warn'}">${v.firstN?pct(v.firstC,v.firstN)+'%':'未学習'}</span></div><p class="muted">初回 ${v.firstC}/${v.firstN}問正解 · 解き直し含む ${v.allC}/${v.allN}回正解</p><div class="bar"><div style="width:${pct(v.firstC,v.firstN)}%"></div></div><button type="button" class="smallbtn" data-domain="${i}">この分野を学習</button></div>`).join('')}</section><section class="card"><h2>🎯 おすすめ学習分野</h2><strong>${escape(suggestion)}</strong><p class="muted">コンプライアンスが80%未満なら最優先。それ以外は初回正答率と試験の出題数から、想定失点が多い分野を優先する簡易判定だよ。未学習の分野は含めていないよ。</p></section><section class="card"><h2>📋 模試履歴</h2>${m.length?m.slice().reverse().slice(0,10).map(x=>`<div class="listitem">${new Date(x.at).toLocaleDateString('ja-JP')} · ${escape(x.setName)}<br>${x.examType==='new'?'新規':'更新'}：${x.correct}/70問 · コンプライアンス ${x.compliance}/5問 · <b>${x.passed?'合格':'不合格'}</b></div>`).join(''):'<p class="muted">まだ記録がないよ。</p>'}</section>`);}

function account(){page='account';el(header('👤 プレイヤー設定','ニックネームを自由に設定しよう！')+nav()+`<section class="card"><h2>🎮 プロフィール</h2><label class="field" for="nick">ニックネーム</label><input id="nick" maxlength="20" placeholder="例：勇者ねこ" value="${escape(profile.nickname||'')}"><p class="muted">この試作版では、この端末にだけ保存されるよ。クルーコードは入力しないでね。</p>${button('ニックネームを保存','saveNick')}</section><section class="card"><h2>👑 管理者画面（デザイン確認）</h2><p class="muted">管理者1名・クルー登録・パスコード再発行・問題管理を想定した画面プレビューだよ。</p>${button('管理画面の試作を見る','adminPreview','secondary')}</section><div class="demoBadge">🔐 ver.0.5.1は画面設計を確認するローカル試作版。実際のログイン認証・アカウント発行・非公開データベース・クラウド同期は未実装。社内のクルーコードや実問題は入力・登録しないでね。</div>`);}
function adminPreview(){page='adminPreview';el(header('👑 管理者ダッシュボード','管理者1名向けの画面イメージ')+`<div class="demoBadge">⚠️ 表示専用の試作画面だよ。ここではアカウント発行・認証・問題登録は行えないよ。</div><section class="card"><h2>👥 クルー管理</h2><div class="grid"><div class="stat"><small>登録クルー</small><b>—</b></div><div class="stat"><small>利用停止</small><b>—</b></div></div><p class="muted">予定機能：10桁クルーコードをIDとして登録、初回パスコード発行、利用停止、再設定。認証情報はサーバー側で安全に管理する予定。</p><button class="btn secondary" disabled>＋ クルーを登録（未実装）</button></section><section class="card"><h2>📚 問題集管理</h2><p class="muted">予定機能：非公開データベースで問題・解答を登録／編集。公開GitHubには実問題を含めない。</p><button class="btn secondary" disabled>問題集を追加（未実装）</button></section>${button('👤 プレイヤー設定へ戻る','account','outline')}`);}

document.querySelector('.bottom-nav').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const temp=document.createElement('button');temp.dataset.action=b.dataset.action;temp.style.display='none';root.appendChild(temp);temp.click();temp.remove();});
root.addEventListener('change',e=>{if(e.target.id==='reviewSet'){reviewTarget=e.target.value;review();return;}if(e.target.id==='set')chosenSet=e.target.value;if(e.target.id==='domain')chosenDomain=e.target.value;if(e.target.id==='examType')examType=e.target.value;});
root.addEventListener('click',e=>{try{let f=e.target.closest('[data-fav]');if(f){toggleFavorite(f.dataset.fav);if(page==='quiz')renderQuiz();else review();return;}let filter=e.target.closest('[data-filter]');if(filter){reviewFilter=filter.dataset.filter;review();return;}let c=e.target.closest('[data-choice]');if(c){if(graded)return;let j=Number(c.dataset.choice),q=active[idx];if(q.type==='multi'){selected=selected.includes(j)?selected.filter(x=>x!==j):selected.concat(j);}else selected=[j];renderQuiz();return;}let d=e.target.closest('[data-domain]');if(d){chosenDomain=d.dataset.domain;setup();return;}let b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'openSingleReview':{const id=b.dataset.questionId;const q=allQuestions().find(item=>item.id===id);if(!q){error.textContent='復習する問題が見つからないよ。再読み込みしてね。';break;}mode='review';active=[q];idx=0;selected=[];graded=false;lastResult=null;renderQuiz();break;}case'home':home();break;case'account':account();break;case'adminPreview':adminPreview();break;case'saveNick':{const v=(document.getElementById('nick')?.value||'').trim();if(!v){alert('ニックネームを入力してね！');break;}profile.nickname=v;profileSave();account();break;}case'setup':setup();break;case'analysis':analysis();break;case'review':review();break;case'startReview':startReview();break;case'startStudy':start('study');break;case'startCompliance':startCompliance();break;case'startMock':mockAnswers=[];start('mock');break;case'grade':grade();break;case'next':next();break;case'exit':if(confirm('途中の問題演習を終了してホームに戻る？（模試の途中結果は保存されないよ）'))home();break;}}catch(err){error.textContent='操作中にエラーが発生したよ：'+err.message;console.error(err);}});
try{home();}catch(e){error.textContent='表示中にエラーが発生しました：'+e.message;}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=051',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));}
})();
</script></body></html>
