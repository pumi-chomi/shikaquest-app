<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3676ed"><meta name="apple-mobile-web-app-capable" content="yes"><title>シカクエスト</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#203154;background:#eff6ff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffae36;outline-offset:2px}.app{max-width:560px;margin:auto;min-height:100vh;padding:20px 16px 45px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900;font-size:23px;color:#2868d5}.badge{background:#fff;border-radius:99px;padding:9px 13px;color:#55709a;font-size:12px}.hero{background:linear-gradient(125deg,#3b83f5,#7166ed);border-radius:24px;padding:23px;color:white;box-shadow:0 12px 25px #316ed332}.hero h1{margin:0 0 8px;font-size:25px}.hero p{margin:0 0 18px;opacity:.95;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff24;border-radius:13px;padding:11px 7px;text-align:center}.stat strong{display:block;font-size:21px}.stat small{font-size:11px}.section{font-size:17px;font-weight:800;margin:24px 0 12px}.card{background:#fff;border-radius:19px;padding:17px;margin-bottom:12px;box-shadow:0 4px 15px #2a66c40e}.action{display:flex;width:100%;align-items:center;text-align:left;border:0;gap:13px}.icon{font-size:27px;background:#eef5ff;border-radius:14px;padding:12px}.action strong{display:block;font-size:16px}.action small{display:block;color:#667997;margin-top:5px;font-size:12px}.arrow{margin-left:auto;color:#7890b5}.primary{border:0;background:#3478eb;color:#fff;border-radius:14px;padding:15px 18px;font-weight:800;min-height:50px;width:100%}.secondary{border:1px solid #c8d7f1;background:#fff;color:#3769bf;border-radius:14px;padding:13px 16px;font-weight:700;min-height:48px;width:100%}.muted{color:#687b99;font-size:13px}.progress{height:10px;background:#e8effa;border-radius:20px;overflow:hidden;margin:15px 0}.fill{height:100%;background:#4e86ef;width:0%;transition:width .2s}.question{font-size:20px;line-height:1.65;font-weight:800;margin:17px 0}.choice{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:white;border:2px solid #e0e8f5;border-radius:15px;padding:15px 13px;min-height:56px;margin:9px 0;color:#253657}.choice.selected{border-color:#4282f0;background:#eaf2ff}.choice.correct{border-color:#28a57a;background:#e7faf2}.choice.wrong{border-color:#ed6771;background:#fff0f0}.letter{display:grid;place-items:center;flex:none;border-radius:9px;background:#eff4fb;width:29px;height:29px;font-weight:800}.row{display:flex;gap:10px;margin-top:15px}.row>*{flex:1}.result{background:#fff;border-radius:19px;padding:22px;text-align:center}.score{font-size:52px;font-weight:900;color:#3978e7}.note{padding:13px;border-radius:13px;background:#f1f6ff;margin:12px 0;font-size:14px;line-height:1.7}.hidden{display:none!important}.footer{text-align:center;color:#8b9bb5;font-size:11px;margin-top:25px}#error{background:#fff3f3;color:#9b2834;border-radius:12px;padding:12px;margin-bottom:12px} @media(max-width:360px){.app{padding:14px 11px}.hero{padding:18px}.question{font-size:18px}}
</style></head><body><main class="app"><div class="top"><div class="brand">🎮 シカクエスト</div><span class="badge">サンプル版 0.2</span></div><div id="error" class="hidden">画面の読み込みで問題が発生したよ。ページを再読み込みしてみてね。</div><section id="home"><div class="hero"><h1>今日も一歩、合格へ！✨</h1><p>スキマ時間に楽しくレベルアップしよう</p><div class="stats"><div class="stat"><strong id="total">0</strong><small>解答数</small></div><div class="stat"><strong id="rate">—</strong><small>正答率</small></div><div class="stat"><strong id="level">1</strong><small>レベル</small></div></div></div><h2 class="section">学習メニュー</h2><button class="card action" id="learn"><span class="icon">📖</span><span><strong>1問ずつ学習</strong><small>答え合わせしながら10問に挑戦</small></span><span class="arrow">›</span></button><button class="card action" id="exam"><span class="icon">🏆</span><span><strong>模擬試験</strong><small>最後にまとめて採点する10問テスト</small></span><span class="arrow">›</span></button><button class="card action" id="review"><span class="icon">💪</span><span><strong>苦手問題を復習</strong><small id="weakCount">間違えた問題：0問</small></span><span class="arrow">›</span></button><div class="card"><strong>📊 最近の模擬試験</strong><p id="lastExam" class="muted">まだ受験していないよ</p></div><p class="footer">※一般常識の架空サンプル問題のみ収録。社内資料は含みません。</p></section><section id="quiz" class="hidden"><div class="card"><div class="top"><strong id="modeTitle">学習モード</strong><span id="counter" class="badge">1 / 10</span></div><div class="progress"><div class="fill" id="bar"></div></div><p id="type" class="muted">1つ選択</p><div id="question" class="question"></div><div id="choices"></div><div id="feedback" class="note hidden" aria-live="polite"></div><div class="row"><button id="quit" class="secondary">終了する</button><button id="next" class="primary" disabled>解答する</button></div></div></section><section id="finish" class="hidden"><div class="result"><div style="font-size:42px">🎉</div><h2 id="resultTitle">おつかれさま！</h2><div id="score" class="score">0%</div><p id="resultText" class="muted"></p><button class="primary" id="again">もう一度挑戦</button><div style="height:10px"></div><button class="secondary" id="backHome">ホームへ戻る</button></div></section></main><script>
(function(){'use strict';
const Q=[
{id:'q1',q:'日本の首都はどこ？',options:['大阪','東京','京都','札幌'],correct:[1],ex:'日本の首都は東京だよ。'},
{id:'q2',q:'1時間は何分？',options:['30分','60分','90分','100分'],correct:[1],ex:'1時間は60分。'},
{id:'q3',q:'次のうち偶数をすべて選んでね。',options:['2','3','6','9'],correct:[0,2],ex:'2と6は2で割り切れるよ。'},
{id:'q4',q:'水が通常の大気圧で凍る温度は0℃？',options:['○','×'],correct:[0],ex:'通常の大気圧では0℃で凍るよ。'},
{id:'q5',q:'日本の通貨単位は？',options:['ドル','ユーロ','円','ウォン'],correct:[2],ex:'日本の通貨単位は円。'},
{id:'q6',q:'太陽は恒星である。',options:['○','×'],correct:[0],ex:'太陽は自ら光を出す恒星だよ。'},
{id:'q7',q:'三角形の内角の和は？',options:['90度','180度','270度','360度'],correct:[1],ex:'三角形の内角の和は180度。'},
{id:'q8',q:'次のうち果物をすべて選んでね。',options:['りんご','みかん','鉛筆','バナナ'],correct:[0,1,3],ex:'りんご、みかん、バナナが果物だよ。'},
{id:'q9',q:'日本の国旗に使われている色は？',options:['赤と白','青と白','赤と青','緑と白'],correct:[0],ex:'白地に赤い円が描かれているよ。'},
{id:'q10',q:'1キロメートルは100メートルである。',options:['○','×'],correct:[1],ex:'1キロメートルは1000メートルだよ。'}];
const $=id=>document.getElementById(id);let store={total:0,correct:0,wrong:[],lastExam:null};try{const s=JSON.parse(localStorage.getItem('shikaquest_demo_v02')||'null');if(s&&typeof s.total==='number'&&Array.isArray(s.wrong))store=Object.assign(store,s)}catch(e){}let mode='learn',list=[],pos=0,selected=[],locked=false,answers=[];
function save(){try{localStorage.setItem('shikaquest_demo_v02',JSON.stringify(store))}catch(e){}}
function show(id){['home','quiz','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function home(){$('total').textContent=store.total;$('rate').textContent=store.total?Math.round(store.correct/store.total*100)+'%':'—';$('level').textContent=1+Math.floor(store.correct/20);$('weakCount').textContent='間違えた問題：'+store.wrong.length+'問';$('lastExam').textContent=store.lastExam?store.lastExam.correct+' / '+store.lastExam.total+'問 正解（'+store.lastExam.date+'）':'まだ受験していないよ';show('home')}
function start(m){mode=m;list=m==='review'?Q.filter(q=>store.wrong.includes(q.id)):Q.slice();if(!list.length){alert('まだ苦手問題はないよ！ まずは学習してみよう。');return}pos=0;selected=[];locked=false;answers=[];show('quiz');render()}
function render(){const q=list[pos];locked=false;selected=[];$('modeTitle').textContent=mode==='exam'?'🏆 模擬試験':mode==='review'?'💪 苦手克服':'📖 学習モード';$('counter').textContent=(pos+1)+' / '+list.length;$('bar').style.width=(pos/list.length*100)+'%';$('type').textContent=q.correct.length>1?'複数選択：当てはまるものをすべて選ぼう':'1つ選択';$('question').textContent=q.q;$('feedback').classList.add('hidden');$('feedback').textContent='';$('next').disabled=true;$('next').textContent='解答する';const wrap=$('choices');wrap.replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';const l=document.createElement('span');l.className='letter';l.textContent=String.fromCharCode(65+i);const t=document.createElement('span');t.textContent=opt;b.append(l,t);b.addEventListener('click',()=>{if(locked)return;if(q.correct.length===1)selected=[i];else selected=selected.includes(i)?selected.filter(x=>x!==i):selected.concat(i);Array.from(wrap.children).forEach((el,j)=>el.classList.toggle('selected',selected.includes(j)));$('next').disabled=!selected.length});wrap.append(b)})}
function equal(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function next(){if(locked){advance();return}if(!selected.length)return;const q=list[pos],right=equal(selected,q.correct);answers.push({id:q.id,right});store.total++;if(right)store.correct++;if(!right&&!store.wrong.includes(q.id))store.wrong.push(q.id);if(right)store.wrong=store.wrong.filter(x=>x!==q.id);save();locked=true;if(mode==='exam'){advance();return}Array.from($('choices').children).forEach((el,i)=>{el.disabled=true;if(q.correct.includes(i))el.classList.add('correct');else if(selected.includes(i))el.classList.add('wrong')});$('feedback').textContent=(right?'✅ 正解！ ':'❌ 惜しい！ ')+q.ex;$('feedback').classList.remove('hidden');$('next').textContent=pos===list.length-1?'結果を見る':'次の問題へ';$('next').disabled=false}
function advance(){if(pos<list.length-1){pos++;render()}else finish()}
function finish(){const n=answers.filter(a=>a.right).length,pct=Math.round(n/list.length*100);$('resultTitle').textContent=pct===100?'パーフェクト！ 🌟':'おつかれさま！';$('score').textContent=pct+'%';$('resultText').textContent=list.length+'問中 '+n+'問正解！ '+(mode==='exam'?'模擬試験の結果を保存したよ。':'間違えた問題は復習できるよ。');if(mode==='exam'){store.lastExam={correct:n,total:list.length,date:new Date().toLocaleDateString('ja-JP')};save()}show('finish')}
$('learn').addEventListener('click',()=>start('learn'));$('exam').addEventListener('click',()=>start('exam'));$('review').addEventListener('click',()=>start('review'));$('next').addEventListener('click',next);$('quit').addEventListener('click',()=>{if(confirm('学習を終了してホームに戻る？'))home()});$('again').addEventListener('click',()=>start(mode));$('backHome').addEventListener('click',home);home();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
